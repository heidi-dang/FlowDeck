name: Build FDX Native Packages

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:

jobs:
  build-binaries:
    name: Build FDX (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x64-gnu
            os: ubuntu-latest
            pkg: flowdeck-fdx-linux-x64-gnu
            rust_target: x86_64-unknown-linux-gnu
            binary: fdx
          - name: linux-arm64-gnu
            os: ubuntu-latest
            pkg: flowdeck-fdx-linux-arm64-gnu
            rust_target: aarch64-unknown-linux-gnu
            binary: fdx
          - name: linux-x64-musl
            os: ubuntu-latest
            pkg: flowdeck-fdx-linux-x64-musl
            rust_target: x86_64-unknown-linux-musl
            binary: fdx
          - name: darwin-x64
            os: macos-latest
            pkg: flowdeck-fdx-darwin-x64
            rust_target: x86_64-apple-darwin
            binary: fdx
          - name: darwin-arm64
            os: macos-latest
            pkg: flowdeck-fdx-darwin-arm64
            rust_target: aarch64-apple-darwin
            binary: fdx
          - name: win32-x64
            os: windows-latest
            pkg: flowdeck-fdx-win32-x64
            rust_target: x86_64-pc-windows-msvc
            binary: fdx.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies & Cross Toolchains
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target.rust_target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static
          elif [ "${{ matrix.target.rust_target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_target }}

      - name: Build FDX Binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --manifest-path crates/fdx/Cargo.toml --release --locked --target ${{ matrix.target.rust_target }}

      - name: Verify Binary Execution Sanity
        shell: bash
        run: |
          BIN="target/${{ matrix.target.rust_target }}/release/${{ matrix.target.binary }}"
          if [ "${{ matrix.target.rust_target }}" = "aarch64-unknown-linux-gnu" ]; then
            qemu-aarch64-static -L /usr/aarch64-linux-gnu "$BIN" --version
          elif [ "${{ runner.os }}" != "Windows" ]; then
            "$BIN" --version
          else
            ./$BIN --version
          fi

      - name: Populate Package & Provenance Manifest
        shell: bash
        run: |
          mkdir -p packages/${{ matrix.target.pkg }}
          BIN_PATH="target/${{ matrix.target.rust_target }}/release/${{ matrix.target.binary }}"
          cp "$BIN_PATH" packages/${{ matrix.target.pkg }}/
          cd packages/${{ matrix.target.pkg }}

          if [ "${{ runner.os }}" = "Windows" ]; then
            SHA=$(certutil -hashfile ${{ matrix.target.binary }} SHA256 | grep -v "hash" | tr -d '\r\n ')
            SIZE=$(powershell -Command "(Get-Item '${{ matrix.target.binary }}').Length")
          else
            SHA=$(shasum -a 256 ${{ matrix.target.binary }} | awk '{print $1}')
            SIZE=$(stat -c%s ${{ matrix.target.binary }} 2>/dev/null || stat -f%z ${{ matrix.target.binary }})
          fi

          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          HEAD_REF="${{ github.head_ref || github.ref_name }}"
          RUST_VER=$(rustc --version 2>/dev/null || echo "rustc stable")

          cat <<EOF > checksum.json
          {
            "packageName": "@heidi-dang/${{ matrix.target.pkg }}",
            "version": "1.0.4",
            "executable": "${{ matrix.target.binary }}",
            "sha256": "$SHA",
            "builtAt": "$NOW"
          }
          EOF

          cat <<EOF > provenance.json
          {
            "packageName": "@heidi-dang/${{ matrix.target.pkg }}",
            "packageVersion": "1.0.4",
            "flowdeckVersion": "1.0.4",
            "fdxBinaryVersion": "1.0.4",
            "fdxProtocolVersion": "1.0.0",
            "targetTriple": "${{ matrix.target.rust_target }}",
            "platform": "${{ runner.os }}",
            "architecture": "${{ matrix.target.name }}",
            "binaryFilename": "${{ matrix.target.binary }}",
            "binaryByteSize": $SIZE,
            "sha256": "$SHA",
            "sourceCommitSha": "$HEAD_SHA",
            "gitCommit": "$HEAD_SHA",
            "gitBranch": "$HEAD_REF",
            "workflowRunId": "${{ github.run_id }}",
            "ciRunId": "${{ github.run_id }}",
            "builderPlatform": "${{ runner.os }}/${{ matrix.target.name }}",
            "rustVersion": "$RUST_VER",
            "buildProfile": "release",
            "buildTimestamp": "$NOW"
          }
          EOF

          cp ../../LICENSE . || true
          if [ ! -f README.md ]; then
            echo "# @heidi-dang/${{ matrix.target.pkg }}" > README.md
            echo "Prebuilt native FDX executable binary for FlowDeck." >> README.md
          fi

      - name: Pack Native Package (.tgz)
        shell: bash
        run: |
          cd packages/${{ matrix.target.pkg }}
          npm pack
          ls -la *.tgz

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.pkg }}
          path: packages/${{ matrix.target.pkg }}/

  inspect-and-clean-install:
    name: Inspect & Clean-Install (${{ matrix.target.os }})
    needs: build-binaries
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            pkg: flowdeck-fdx-linux-x64-gnu
            binary: fdx
          - os: macos-latest
            pkg: flowdeck-fdx-darwin-arm64
            binary: fdx
          - os: windows-latest
            pkg: flowdeck-fdx-win32-x64
            binary: fdx.exe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target.pkg }}
          path: packages/${{ matrix.target.pkg }}

      - name: Inspect and Clean-Install Package
        shell: bash
        run: |
          cd packages/${{ matrix.target.pkg }}
          TGZ=$(ls *.tgz | head -n 1)
          echo "=== Inspecting tarball $TGZ ==="
          tar tzf "$TGZ" > /tmp/files.txt
          grep -q "package/${{ matrix.target.binary }}" /tmp/files.txt || { echo "FAIL: binary missing"; exit 1; }
          grep -q "package/checksum.json" /tmp/files.txt || { echo "FAIL: checksum.json missing"; exit 1; }
          grep -q "package/provenance.json" /tmp/files.txt || { echo "FAIL: provenance.json missing"; exit 1; }
          grep -q "package/package.json" /tmp/files.txt || { echo "FAIL: package.json missing"; exit 1; }
          if grep -E 'package/crates/|package/target/' /tmp/files.txt; then
            echo "FAIL: Forbidden source or build artifacts found in platform tarball"
            exit 1
          fi
          echo "✓ Tarball structure & contents verified clean"

          TMP_APP=$(mktemp -d)
          cd "$TMP_APP"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/packages/${{ matrix.target.pkg }}/$TGZ"
          INSTALLED_BIN="node_modules/@heidi-dang/${{ matrix.target.pkg }}/${{ matrix.target.binary }}"
          test -f "$INSTALLED_BIN" || { echo "FAIL: Installed binary not found"; exit 1; }
          if [ "${{ matrix.target.binary }}" = "fdx.exe" ]; then
            ./"$INSTALLED_BIN" --version
          else
            "$INSTALLED_BIN" --version
          fi
          echo "✓ Clean install and native binary execution verified successfully"
