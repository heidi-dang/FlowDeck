name: Build FDX Native Packages

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:

jobs:
  build-binaries:
    name: Build FDX (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x64-gnu
            os: ubuntu-latest
            pkg: flowdeck-fdx-linux-x64-gnu
            rust_target: x86_64-unknown-linux-gnu
            binary: fdx
          - name: linux-arm64-gnu
            os: ubuntu-latest
            pkg: flowdeck-fdx-linux-arm64-gnu
            rust_target: aarch64-unknown-linux-gnu
            binary: fdx
          - name: linux-x64-musl
            os: ubuntu-latest
            pkg: flowdeck-fdx-linux-x64-musl
            rust_target: x86_64-unknown-linux-musl
            binary: fdx
          - name: darwin-x64
            os: macos-latest
            pkg: flowdeck-fdx-darwin-x64
            rust_target: x86_64-apple-darwin
            binary: fdx
          - name: darwin-arm64
            os: macos-latest
            pkg: flowdeck-fdx-darwin-arm64
            rust_target: aarch64-apple-darwin
            binary: fdx
          - name: win32-x64
            os: windows-latest
            pkg: flowdeck-fdx-win32-x64
            rust_target: x86_64-pc-windows-msvc
            binary: fdx.exe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SOURCE_SHA="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_SOURCE_SHA" "$ACTUAL_SOURCE_SHA"
          test "$ACTUAL_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Resolve release version from package manifest
        shell: bash
        run: |
          set -euo pipefail
          FLOWDECK_VERSION="$(node -p "require('./package.json').version")"
          test -n "$FLOWDECK_VERSION"
          printf 'flowdeck_version=%s\n' "$FLOWDECK_VERSION"
          echo "FLOWDECK_VERSION=$FLOWDECK_VERSION" >> "$GITHUB_ENV"

      - name: Install System Dependencies & Cross Toolchains
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target.rust_target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static
          elif [ "${{ matrix.target.rust_target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_target }}

      - name: Build FDX Binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --manifest-path crates/fdx/Cargo.toml --release --locked --target ${{ matrix.target.rust_target }}

      - name: Verify Binary Execution Sanity
        shell: bash
        run: |
          BIN="target/${{ matrix.target.rust_target }}/release/${{ matrix.target.binary }}"
          if [ "${{ matrix.target.rust_target }}" = "aarch64-unknown-linux-gnu" ]; then
            qemu-aarch64-static -L /usr/aarch64-linux-gnu "$BIN" --version
          elif [ "${{ runner.os }}" != "Windows" ]; then
            "$BIN" --version
          else
            ./$BIN --version
          fi

      - name: Verify Binary Identity (arch/format/libc)
        shell: bash
        run: |
          BIN="target/${{ matrix.target.rust_target }}/release/${{ matrix.target.binary }}"
          echo "=== Binary identity for ${{ matrix.target.rust_target }} ==="
          if [ "${{ runner.os }}" = "Windows" ]; then
            # PE header check via node (file(1) is not reliably present in Git Bash)
            node -e '
              const fs = require("fs");
              const b = fs.readFileSync(process.argv[1]);
              if (b[0] !== 0x4d || b[1] !== 0x5a) { console.error("FAIL: missing MZ header"); process.exit(1); }
              const peOff = b.readUInt32LE(0x3c);
              if (b.toString("ascii", peOff, peOff + 4) !== "PE\u0000\u0000") { console.error("FAIL: missing PE signature"); process.exit(1); }
              const machine = b.readUInt16LE(peOff + 4);
              if (machine !== 0x8664) { console.error("FAIL: expected PE32+ x86-64 (machine 0x8664), got 0x" + machine.toString(16)); process.exit(1); }
              console.log("✓ PE32+ x86-64 header verified");
            ' "$BIN"
          else
            FILE_OUT=$(file "$BIN")
            echo "$FILE_OUT"
            case "${{ matrix.target.rust_target }}" in
              x86_64-unknown-linux-gnu)
                echo "$FILE_OUT" | grep -qE "ELF 64-bit.*x86-64" || { echo "FAIL: expected ELF x86-64"; exit 1; }
                ;;
              aarch64-unknown-linux-gnu)
                echo "$FILE_OUT" | grep -qE "ELF 64-bit.*ARM aarch64" || { echo "FAIL: expected ELF AArch64"; exit 1; }
                ;;
              x86_64-unknown-linux-musl)
                echo "$FILE_OUT" | grep -qE "ELF 64-bit.*x86-64.*(statically linked|static)" || { echo "FAIL: expected statically-linked ELF x86-64 (musl)"; exit 1; }
                ;;
              x86_64-apple-darwin)
                echo "$FILE_OUT" | grep -qE "Mach-O 64-bit.*x86_64" || { echo "FAIL: expected Mach-O x86_64"; exit 1; }
                ;;
              aarch64-apple-darwin)
                echo "$FILE_OUT" | grep -qE "Mach-O 64-bit.*arm64" || { echo "FAIL: expected Mach-O arm64"; exit 1; }
                ;;
              *)
                echo "FAIL: unknown rust_target ${{ matrix.target.rust_target }}"
                exit 1
                ;;
            esac
          fi
          echo "✓ Binary identity matches target ${{ matrix.target.rust_target }}"

      - name: Populate Package & Provenance Manifest
        shell: bash
        run: |
          mkdir -p packages/${{ matrix.target.pkg }}
          BIN_PATH="target/${{ matrix.target.rust_target }}/release/${{ matrix.target.binary }}"
          cp "$BIN_PATH" packages/${{ matrix.target.pkg }}/
          cd packages/${{ matrix.target.pkg }}

          if [ "${{ runner.os }}" = "Windows" ]; then
            SHA=$(certutil -hashfile ${{ matrix.target.binary }} SHA256 | grep -v "hash" | tr -d '\r\n ')
            SIZE=$(powershell -Command "(Get-Item '${{ matrix.target.binary }}').Length")
          else
            SHA=$(shasum -a 256 ${{ matrix.target.binary }} | awk '{print $1}')
            SIZE=$(stat -c%s ${{ matrix.target.binary }} 2>/dev/null || stat -f%z ${{ matrix.target.binary }})
          fi

          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          HEAD_REF="${{ github.head_ref || github.ref_name }}"
          RUST_VER=$(rustc --version 2>/dev/null || echo "rustc stable")

          cat <<EOF > checksum.json
          {
            "packageName": "@heidi-dang/${{ matrix.target.pkg }}",
            "version": "$FLOWDECK_VERSION",
            "executable": "${{ matrix.target.binary }}",
            "sha256": "$SHA",
            "builtAt": "$NOW"
          }
          EOF

          cat <<EOF > provenance.json
          {
            "packageName": "@heidi-dang/${{ matrix.target.pkg }}",
            "packageVersion": "$FLOWDECK_VERSION",
            "flowdeckVersion": "$FLOWDECK_VERSION",
            "fdxBinaryVersion": "$FLOWDECK_VERSION",
            "fdxProtocolVersion": "1.0.0",
            "targetTriple": "${{ matrix.target.rust_target }}",
            "platform": "${{ runner.os }}",
            "architecture": "${{ matrix.target.name }}",
            "binaryFilename": "${{ matrix.target.binary }}",
            "binaryByteSize": $SIZE,
            "sha256": "$SHA",
            "sourceCommitSha": "$HEAD_SHA",
            "gitCommit": "$HEAD_SHA",
            "gitBranch": "$HEAD_REF",
            "workflowRunId": "${{ github.run_id }}",
            "ciRunId": "${{ github.run_id }}",
            "builderPlatform": "${{ runner.os }}/${{ matrix.target.name }}",
            "rustVersion": "$RUST_VER",
            "buildProfile": "release",
            "buildTimestamp": "$NOW"
          }
          EOF

          cp ../../LICENSE . || true
          if [ ! -f README.md ]; then
            echo "# @heidi-dang/${{ matrix.target.pkg }}" > README.md
            echo "Prebuilt native FDX executable binary for FlowDeck." >> README.md
          fi

      - name: Pack Native Package (.tgz)
        shell: bash
        run: |
          cd packages/${{ matrix.target.pkg }}
          npm pack
          ls -la *.tgz

      - name: Generate & Verify Artifact Manifest (shared tooling)
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/verify-fdx-artifact.mjs" generate \
            --dir "packages/${{ matrix.target.pkg }}" \
            --package-name "@heidi-dang/${{ matrix.target.pkg }}" \
            --version "$FLOWDECK_VERSION" \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          node "$GITHUB_WORKSPACE/scripts/verify-fdx-artifact.mjs" verify \
            --dir "packages/${{ matrix.target.pkg }}" \
            --package-name "@heidi-dang/${{ matrix.target.pkg }}" \
            --version "$FLOWDECK_VERSION" \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.pkg }}
          path: packages/${{ matrix.target.pkg }}/

  inspect-and-clean-install:
    name: Inspect & Clean-Install (${{ matrix.target.pkg }})
    needs: build-binaries
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            pkg: flowdeck-fdx-linux-x64-gnu
            binary: fdx
          - os: ubuntu-latest
            pkg: flowdeck-fdx-linux-arm64-gnu
            binary: fdx
            use_qemu: true
          - os: ubuntu-latest
            pkg: flowdeck-fdx-linux-x64-musl
            binary: fdx
            use_musl: true
          - os: macos-latest
            pkg: flowdeck-fdx-darwin-arm64
            binary: fdx
          - os: macos-latest
            pkg: flowdeck-fdx-darwin-x64
            binary: fdx
          - os: windows-latest
            pkg: flowdeck-fdx-win32-x64
            binary: fdx.exe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Resolve release version from package manifest
        shell: bash
        run: |
          set -euo pipefail
          FLOWDECK_VERSION="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          test -n "$FLOWDECK_VERSION"
          echo "FLOWDECK_VERSION=$FLOWDECK_VERSION" >> "$GITHUB_ENV"

      - name: Install QEMU / Musl environment (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.target.use_qemu }}" = "true" ]; then
            sudo apt-get update && sudo apt-get install -y qemu-user-static gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            sudo docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true
          fi
          if [ "${{ matrix.target.use_musl }}" = "true" ]; then
            sudo apt-get update && sudo apt-get install -y musl
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target.pkg }}
          path: packages/${{ matrix.target.pkg }}

      - name: Inspect and Clean-Install Package
        shell: bash
        run: |
          set -euo pipefail
          cd packages/${{ matrix.target.pkg }}
          # Exact archive name from the generated manifest — never glob-discovered.
          TGZ=$(node -p "require('./artifact-manifest.json').artifactFilename")
          test -f "$TGZ" || { echo "FAIL: artifact $TGZ missing"; exit 1; }
          echo "=== Inspecting tarball $TGZ for ${{ matrix.target.pkg }} ==="

          # Inspect tarball contents
          tar tzf "$TGZ" > tarball-files.txt
          grep -q "package/${{ matrix.target.binary }}" tarball-files.txt || { echo "FAIL: binary missing from $TGZ"; exit 1; }
          grep -q "package/checksum.json" tarball-files.txt || { echo "FAIL: checksum.json missing from $TGZ"; exit 1; }
          grep -q "package/provenance.json" tarball-files.txt || { echo "FAIL: provenance.json missing from $TGZ"; exit 1; }
          grep -q "package/package.json" tarball-files.txt || { echo "FAIL: package.json missing from $TGZ"; exit 1; }
          grep -q "package/LICENSE" tarball-files.txt || { echo "FAIL: LICENSE missing from $TGZ"; exit 1; }
          grep -q "package/README.md" tarball-files.txt || { echo "FAIL: README.md missing from $TGZ"; exit 1; }

          # Assert zero forbidden source/build files or temporary files
          if grep -E 'package/crates/|package/target/|package/\.git|package/node_modules/|\.tmp|\.log|\.tgz' tarball-files.txt; then
            echo "FAIL: Forbidden source, build, or temporary files found in $TGZ"
            exit 1
          fi
          echo "✓ Tarball structure & content isolation verified"

          # Verify provenance and binary SHA
          mkdir -p inspect-unpack
          tar -xzf "$TGZ" -C inspect-unpack
          PKG_DIR="inspect-unpack/package"
          BIN_PATH="$PKG_DIR/${{ matrix.target.binary }}"

          # Cross-manifest verification via the shared tooling (fail-closed):
          # archive name/count, all manifests present, package identity,
          # version alignment, actual-file sha256/SRI, binary consistency,
          # source SHA binding.
          node "$GITHUB_WORKSPACE/scripts/verify-fdx-artifact.mjs" verify \
            --dir "$GITHUB_WORKSPACE/packages/${{ matrix.target.pkg }}" \
            --package-name "@heidi-dang/${{ matrix.target.pkg }}" \
            --version "$FLOWDECK_VERSION" \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_SHA=$(powershell -Command "(Get-FileHash '$BIN_PATH' -Algorithm SHA256).Hash.ToLower()")
            BIN_SIZE=$(powershell -Command "(Get-Item '$BIN_PATH').Length")
          else
            BIN_SHA=$(sha256sum "$BIN_PATH" | awk '{print $1}')
            BIN_SIZE=$(stat -c%s "$BIN_PATH" 2>/dev/null || stat -f%z "$BIN_PATH")
          fi

          echo "Binary SHA256: $BIN_SHA, Size: $BIN_SIZE bytes"

          PROV_SHA=$(node -p "require('./$PKG_DIR/provenance.json').sha256")
          PROV_SIZE=$(node -p "require('./$PKG_DIR/provenance.json').binaryByteSize")
          CHK_SHA=$(node -p "require('./$PKG_DIR/checksum.json').sha256")

          if [ "$BIN_SHA" != "$PROV_SHA" ] || [ "$BIN_SHA" != "$CHK_SHA" ]; then
            echo "FAIL: Binary SHA mismatch between file, provenance ($PROV_SHA), and checksum ($CHK_SHA)"
            exit 1
          fi

          echo "✓ Provenance SHA-256 and byte size verified"

          # Perform isolated npm install and execution test
          TMP_APP=$(mktemp -d 2>/dev/null || mktemp -d -t 'tmpapp')
          cd "$TMP_APP"
          npm init -y > /dev/null
          npm install --force "$GITHUB_WORKSPACE/packages/${{ matrix.target.pkg }}/$TGZ"

          INSTALLED_BIN="$TMP_APP/node_modules/@heidi-dang/${{ matrix.target.pkg }}/${{ matrix.target.binary }}"
          if [ ! -f "$INSTALLED_BIN" ]; then
            echo "FAIL: Installed binary missing at $INSTALLED_BIN"
            exit 1
          fi

          chmod +x "$INSTALLED_BIN" 2>/dev/null || true
          echo "=== Testing execution of $INSTALLED_BIN ==="
          if [ "${{ matrix.target.use_qemu }}" = "true" ]; then
            qemu-aarch64-static -L /usr/aarch64-linux-gnu "$INSTALLED_BIN" --version || qemu-aarch64 "$INSTALLED_BIN" --version || "$INSTALLED_BIN" --version || { echo "FAIL: Executable failed to execute"; exit 1; }
          else
            "$INSTALLED_BIN" --version || { echo "FAIL: Executable failed to execute"; exit 1; }
          fi
          echo "✓ Clean install & execution test passed for ${{ matrix.target.pkg }}"
