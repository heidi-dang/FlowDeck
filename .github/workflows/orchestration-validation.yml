name: Orchestration Validation

on:
  push:
    branches:
      - main
      - feat/orchestration-validation-framework
  pull_request:

jobs:
  framework-correctness:
    name: Framework Correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Typecheck
        run: npm run typecheck
        
      - name: Framework Self-Tests
        run: |
          npm run test:orchestration:framework
          npm run test:orchestration:matrix
          npm run test:orchestration:port-discovery
          npm run test:orchestration:negative
          
      - name: Validate Artifacts
        run: npm run validate:orchestration:artifacts

  integration-compatibility:
    name: Integration Compatibility
    runs-on: ubuntu-latest
    needs: framework-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Cross-Branch Integration
        env:
          BASE_SHA: bc116721b27346871e6de575daf2738a1c6f624e
        run: npm run test:orchestration:integration:all
        
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-compliance
          path: artifacts/orchestration-compliance/

  bun-compatibility:
    name: Bun Runtime Compatibility
    runs-on: ubuntu-latest
    needs: framework-correctness
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          
      - name: Install dependencies
        run: npm ci
        
      - name: Framework Self-Tests in Latest Bun
        run: npm run test:orchestration:framework
