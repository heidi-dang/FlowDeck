name: CI Production Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feat/*"
      - "fix/*"
      - "ci/*"
      - "audit/*"
      - "docs/*"

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run typecheck

  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      - run: npm run validate:skills
      - run: npm run validate:docs
      - name: Pack and inspect tarball
        run: |
          PACKAGE=$(npm pack 2>/dev/null)
          echo "Package: $PACKAGE"
          tar tzf "$PACKAGE" | grep -q "scripts/config-mutator.mjs" && echo "PASS: scripts/config-mutator.mjs in tarball" || (echo "FAIL: scripts/config-mutator.mjs missing" && exit 1)
          tar tzf "$PACKAGE" | head -20
          tar xzf "$PACKAGE" -O package/package.json | node -e "process.stdin.on('data',d=>{const p=JSON.parse(d);console.assert(p.name==='@heidi-dang/flowdeck','Wrong: '+p.name);console.log('PASS: '+p.name+' v'+p.version)})"
          rm -f "$PACKAGE"
      - name: Packed package install test (isolated HOME)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          PACKAGE=$(npm pack 2>/dev/null)
          echo "Package: $PACKAGE"
          tar tzf "$PACKAGE" | grep -q "scripts/config-mutator.mjs" || { echo "FAIL: config-mutator.mjs missing in tarball"; exit 1; }
          tar tzf "$PACKAGE" | grep -q "bin/flowdeck.js" || { echo "FAIL: bin/flowdeck.js missing in tarball"; exit 1; }
          tar tzf "$PACKAGE" | grep -q "postinstall.mjs" || { echo "FAIL: postinstall.mjs missing in tarball"; exit 1; }
          tar tzf "$PACKAGE" | grep -q "dist/index.js" || { echo "FAIL: dist/index.js missing in tarball"; exit 1; }
          TMP_ROOT=$(mktemp -d)
          TMP_APP="$TMP_ROOT/app"
          TMP_HOME="$TMP_ROOT/home"
          mkdir -p "$TMP_APP" "$TMP_HOME"
          cd "$TMP_APP"
          npm init -y > /dev/null 2>&1
          HOME="$TMP_HOME" OPENCODE_CONFIG_DIR="$TMP_HOME/.config/opencode" npm install "$GITHUB_WORKSPACE/$PACKAGE" 2>&1 | tail -3
          ls node_modules/.bin/flowdeck 2>/dev/null || { echo "FAIL: CLI binary not installed"; exit 1; }
          ls node_modules/@heidi-dang/flowdeck/scripts/config-mutator.mjs 2>/dev/null || { echo "FAIL: config-mutator.mjs not in installed package"; exit 1; }
          echo "PASS: Packed package install and content verified"
          rm -f "$GITHUB_WORKSPACE/$PACKAGE"

  installer-test:
    name: Installer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Clean HOME install
        run: |
          HOME_TMP=$(mktemp -d)
          HOME=$HOME_TMP OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode \
            node bin/flowdeck.js install 2>&1
          node -e "
            const c = JSON.parse(require('fs').readFileSync('$HOME_TMP/.config/opencode/opencode.json','utf-8'));
            console.assert(c.plugin.includes('@heidi-dang/flowdeck'), 'Plugin not registered');
            console.assert(c.default_agent === 'heidi', 'Default agent not heidi');
            console.log('PASS: Clean HOME install');
          "
      - name: Malformed config preserved
        run: |
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          echo '{{{broken}}' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js install 2>&1 || true
          diff <(echo '{{{broken}}') "$OPENCODE_CONFIG_DIR"/opencode.json && echo "PASS: Malformed config preserved" || (echo "FAIL: Config modified" && exit 1)
      - name: JSONC comment retention
        run: |
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          printf '{\n  // this comment must remain\n  "plugin": [],\n  "default_agent": null\n}\n' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js install 2>&1
          grep -q "this comment must remain" "$OPENCODE_CONFIG_DIR"/opencode.json && echo "PASS: JSONC comments preserved" || (echo "FAIL: JSONC comments lost" && exit 1)
      - name: Existing default_agent preserved
        run: |
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          echo '{"plugin":[],"default_agent":"orchestrator"}' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js install 2>&1
          node -e "
            const c = JSON.parse(require('fs').readFileSync('$OPENCODE_CONFIG_DIR/opencode.json','utf-8'));
            console.assert(c.default_agent === 'orchestrator', 'Default changed');
            console.log('PASS: Existing default_agent preserved');
          "
      - name: Ownership safe uninstall (heidi)
        run: |
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          echo '{"plugin":["@heidi-dang/flowdeck"],"default_agent":"heidi"}' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js uninstall 2>&1
          node -e "
            const c = JSON.parse(require('fs').readFileSync('$OPENCODE_CONFIG_DIR/opencode.json','utf-8'));
            console.assert(c.default_agent === 'heidi', 'Default agent was removed without manifest');
            console.log('PASS: heidi default_agent survives uninstall');
          "
      - name: Ownership safe uninstall (orchestrator)
        run: |
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          echo '{"plugin":["@heidi-dang/flowdeck"],"default_agent":"orchestrator"}' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js uninstall 2>&1
          node -e "
            const c = JSON.parse(require('fs').readFileSync('$OPENCODE_CONFIG_DIR/opencode.json','utf-8'));
            console.assert(c.default_agent === 'orchestrator', 'Default agent was removed without manifest');
            console.log('PASS: orchestrator default_agent survives uninstall');
          "
      - name: Verify
        run: node bin/flowdeck.js verify 2>&1
      - name: Doctor
        run: node bin/flowdeck.js doctor 2>&1
      - name: Dry-run
        run: node bin/flowdeck.js dry-run 2>&1
      - name: Uninstall (with manifest)
        run: node bin/flowdeck.js uninstall 2>&1
      - name: CLI Integration Test
        run: |
          set -e
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          echo '{"plugin":[],"default_agent":null}' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js --help 2>&1 | grep -q "FlowDeck v" || { echo "FAIL: --help"; exit 1; }
          echo "PASS: --help"
          node bin/flowdeck.js install 2>&1 | grep -q "FlowDeck installed" || { echo "FAIL: install"; exit 1; }
          echo "PASS: install"
          node bin/flowdeck.js verify 2>&1 | grep -q "Verification passed" || { echo "FAIL: verify"; exit 1; }
          echo "PASS: verify"
          node bin/flowdeck.js doctor 2>&1 || { echo "FAIL: doctor"; exit 1; }
          echo "PASS: doctor"
          node bin/flowdeck.js config validate 2>&1 || { echo "FAIL: config validate"; exit 1; }
          echo "PASS: config validate"
          node bin/flowdeck.js dry-run 2>&1 | grep -q "DRY RUN" || { echo "FAIL: dry-run"; exit 1; }
          echo "PASS: dry-run"
          node bin/flowdeck.js uninstall --force 2>&1 | grep -q "Uninstalled" || { echo "FAIL: uninstall"; exit 1; }
          echo "PASS: uninstall"
          echo "ALL CLI COMMANDS PASSED"

  rust-gates:
    name: Rust Gates (FDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path crates/fdx/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/fdx/Cargo.toml --all-targets -- -D warnings
      - name: Build FDX binary
        run: |
          cargo build --manifest-path crates/fdx/Cargo.toml
          cp target/debug/fdx target/release/fdx 2>/dev/null || true
      - run: cargo test --manifest-path crates/fdx/Cargo.toml --all

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
      - name: Dependency Audit
        run: npm audit --production --audit-level=high 2>&1

  completion:
    name: Pipeline Completion
    if: always()
    needs: [lint-typecheck, test-matrix, build, installer-test, rust-gates, security-scan]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## CI Production Gates" >> $GITHUB_STEP_SUMMARY
          echo "- Lint & Typecheck: ${{ needs.lint-typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test Matrix: ${{ needs.test-matrix.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Validate: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Installer Tests: ${{ needs.installer-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Rust Gates: ${{ needs.rust-gates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.lint-typecheck.result }}" = "success" ] && \
             [ "${{ needs.test-matrix.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.installer-test.result }}" = "success" ] && \
             [ "${{ needs.rust-gates.result }}" = "success" ] && \
             [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "ALL GATES PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "SOME GATES FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
