name: CI Production Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feat/*"
      - "fix/*"
      - "ci/*"
      - "audit/*"
      - "docs/*"

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm ci
      - run: npm run typecheck

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build FDX native helper (required by resolver tests)
        run: cargo build --manifest-path crates/fdx/Cargo.toml
      - run: npm ci
      - name: Build (dist required by packed-layout tests)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Coverage check (unit tests)
        run: bun test tests/check-coverage.test.ts
      - name: Coverage gate (with CI provenance env aligned to checkout)
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          node scripts/check-coverage.mjs
      - name: Routing policy-version gate
        if: github.event_name == 'pull_request'
        run: node scripts/check-routing-policy-version.mjs --base ${{ github.event.pull_request.base.sha }}
      - name: Routing policy-version gate (push)
        if: github.event_name == 'push' && github.event.before != ''
        run: node scripts/check-routing-policy-version.mjs --base ${{ github.event.before }}

  benchmark-runtime:
    name: Runtime Benchmark (Branch-Head)
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout benchmark candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Verify candidate checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected candidate SHA: $CANDIDATE_SHA"
          echo "Actual checkout SHA:    $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$CANDIDATE_SHA" ]; then
            echo "FAIL: benchmark checkout does not match the PR branch head"
            exit 1
          fi
      - name: Materialize runtime implementation baseline worktree
        run: |
          git fetch --no-tags origin e22e04b38e45405b4ae9f15115012d0dce99c241
          git worktree add --detach "$RUNNER_TEMP/rt-baseline" e22e04b38e45405b4ae9f15115012d0dce99c241
          git -C "$RUNNER_TEMP/rt-baseline" rev-parse HEAD
      - name: Run fail-closed runtime benchmark (candidate = PR branch head)
        env:
          BENCHMARK_OUTPUT_DIR: ${{ runner.temp }}/benchmark-artifacts
        run: |
          bun scripts/benchmark-runtime.ts \
            --candidate "$GITHUB_WORKSPACE" \
            --baseline "$RUNNER_TEMP/rt-baseline" \
            --expect-candidate-sha "$CANDIDATE_SHA" \
            --expect-baseline-sha "e22e04b38e45405b4ae9f15115012d0dce99c241"
      - name: Verify branch-head benchmark evidence
        shell: bash
        run: |
          node - "$CANDIDATE_SHA" "$RUNNER_TEMP/benchmark-artifacts/runtime-benchmark.json" <<'NODE'
          const fs = require("node:fs");
          const expectedSha = process.argv[2];
          const artifactPath = process.argv[3];
          const artifact = JSON.parse(fs.readFileSync(artifactPath, "utf8"));
          const fail = (message) => {
            console.error(`FAIL: ${message}`);
            process.exit(1);
          };
          if (artifact.mode !== "baseline-vs-candidate") {
            fail(`unexpected mode: ${artifact.mode}`);
          }
          if (artifact.candidateSha !== expectedSha) {
            fail(`candidateSha=${artifact.candidateSha}, expected=${expectedSha}`);
          }
          if (!artifact.comparison || artifact.comparison.passed !== true) {
            fail("comparison did not pass");
          }
          if (!Array.isArray(artifact.comparison.regressions)) {
            fail("comparison.regressions is missing");
          }
          if (artifact.comparison.regressions.length !== 0) {
            fail(`regressions=${JSON.stringify(artifact.comparison.regressions)}`);
          }
          if (artifact.sampleProfile !== "full") {
            fail(`sampleProfile=${artifact.sampleProfile}`);
          }
          console.log(`PASS: branch-head benchmark evidence for ${expectedSha}`);
          NODE
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/benchmark-artifacts
          if-no-files-found: error
  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build FDX binary (required by real-binary index tests)
        run: cargo build --manifest-path crates/fdx/Cargo.toml
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium (macOS/Windows)
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Run test suite (with CI provenance env aligned to checkout)
        shell: bash
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          npm run test


  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm ci
      - run: npm run build
      - run: npm run validate:skills
      - run: npm run validate:docs
      - name: Pack and inspect tarball
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          node scripts/build-fdx-packages.mjs
          PACKAGE=$(npm pack 2>/dev/null | grep -E '\.tgz$' | tail -n 1 | tr -d '\r')
          echo "Package: $PACKAGE"
          echo "FLOWDECK_TARBALL_PATH=$GITHUB_WORKSPACE/$PACKAGE" >> $GITHUB_ENV
          tar tzf "$PACKAGE" > /tmp/tarball-files.txt
          if grep -E '(^|/)target/|incremental/|\.tmp\.|\.bak\.' /tmp/tarball-files.txt; then
            echo "FAIL: Forbidden build or backup artifacts found in npm package"
            exit 1
          fi
          if grep -E 'package/crates/' /tmp/tarball-files.txt; then
            echo "FAIL: Rust source (crates/) found in consumer package"
            exit 1
          fi
          tar xzf "$PACKAGE" -O package/package.json | node -e "process.stdin.on('data',d=>{const p=JSON.parse(d);console.assert(p.name==='@heidi-dang/flowdeck','Wrong: '+p.name);console.log('PASS: '+p.name+' v'+p.version)})"
          echo "PASS: tarball contents verified clean (no Rust source)"
          rm -f /tmp/tarball-files.txt

      - name: Packed tarball doctor gate (extracted layout, not repo checkout)
        run: |
          set -e
          TMP_ROOT=$(mktemp -d)
          tar xzf "$FLOWDECK_TARBALL_PATH" -C "$TMP_ROOT"
          cd "$TMP_ROOT/package"
          set +e
          FLOWDECK_PROFILE=minimal node src/doctor/cli.mjs --json --non-interactive --profile minimal > "$TMP_ROOT/doctor.json" 2>&1
          DOCTOR_EXIT=$?
          set -e
          if [ "$DOCTOR_EXIT" -ne 0 ]; then
            echo "FAIL: packed doctor exited $DOCTOR_EXIT (expected 0)"
            cat "$TMP_ROOT/doctor.json"
            exit "$DOCTOR_EXIT"
          fi
          node -e "
            const r = require('$TMP_ROOT/doctor.json');
            const errors = r.checks.filter(c => c.status === 'error');
            const skipped = r.checks.filter(c => c.status === 'skipped').map(c => c.id);
            if (errors.length > 0) {
              console.error('FAIL: packed doctor reported errors:', errors.map(e => e.id).join(', '));
              process.exit(1);
            }
            const expected = ['config.tsconfig.json', 'config.uninstall.sh', 'security.gitignore'];
            const missing = expected.filter(id => !skipped.includes(id));
            if (missing.length > 0) {
              console.error('FAIL: repo-only checks not skipped on packed layout:', missing.join(', '));
              process.exit(1);
            }
            console.log('PASS: packed doctor exit 0, zero errors, repo-only checks skipped (' + skipped.join(', ') + ')');
          "

      - name: Packed package full CLI execution (isolated HOME)
        run: |
          set -e
          echo "Package path: $FLOWDECK_TARBALL_PATH"
          cd "$GITHUB_WORKSPACE/packages/flowdeck-fdx-linux-x64-gnu"
          PLATFORM_PKG=$(npm pack 2>/dev/null | grep -E '\.tgz$' | tail -n 1 | tr -d '\r')
          PLATFORM_TARBALL_PATH="$GITHUB_WORKSPACE/packages/flowdeck-fdx-linux-x64-gnu/$PLATFORM_PKG"

          TMP_ROOT=$(mktemp -d)
          TMP_APP="$TMP_ROOT/app"
          TMP_HOME="$TMP_ROOT/home"
          mkdir -p "$TMP_APP" "$TMP_HOME"
          cd "$TMP_APP"
          npm init -y > /dev/null 2>&1
          HOME="$TMP_HOME" OPENCODE_CONFIG_DIR="$TMP_HOME/.config/opencode" npm install "$FLOWDECK_TARBALL_PATH" "$PLATFORM_TARBALL_PATH" 2>&1
          echo "=== Running packed CLI ==="
          HOME="$TMP_HOME" OPENCODE_CONFIG_DIR="$TMP_HOME/.config/opencode" node_modules/.bin/flowdeck --help || { echo "FAIL: --help"; exit 1; }
          echo "PASS: --help"
          HOME="$TMP_HOME" OPENCODE_CONFIG_DIR="$TMP_HOME/.config/opencode" node node_modules/@heidi-dang/flowdeck/bin/flowdeck.js install || { echo "FAIL: install"; exit 1; }
          echo "PASS: install"
          HOME="$TMP_HOME" OPENCODE_CONFIG_DIR="$TMP_HOME/.config/opencode" node node_modules/@heidi-dang/flowdeck/bin/flowdeck.js fdx repair || { echo "FAIL: fdx repair"; exit 1; }
          HOME="$TMP_HOME" OPENCODE_CONFIG_DIR="$TMP_HOME/.config/opencode" node node_modules/@heidi-dang/flowdeck/bin/flowdeck.js verify || { echo "FAIL: verify"; exit 1; }
          echo "PASS: verify"
          set +e
          FLOWDECK_PROFILE=minimal HOME="$TMP_HOME" OPENCODE_CONFIG_DIR="$TMP_HOME/.config/opencode" node node_modules/@heidi-dang/flowdeck/bin/flowdeck.js doctor
          DOCTOR_EXIT=$?
          set -e
          if [ "$DOCTOR_EXIT" -ne 0 ]; then
            echo "FAIL: flowdeck doctor exited $DOCTOR_EXIT in isolated home (expected 0)"
            exit "$DOCTOR_EXIT"
          fi
          HOME="$TMP_HOME" OPENCODE_CONFIG_DIR="$TMP_HOME/.config/opencode" node node_modules/@heidi-dang/flowdeck/bin/flowdeck.js uninstall || { echo "FAIL: uninstall"; exit 1; }
          echo "PASS: uninstall"
          ls node_modules/@heidi-dang/flowdeck/scripts/config-mutator.mjs || { echo "FAIL: config-mutator.mjs missing"; exit 1; }
          echo "PASS: Runtime files verified"
          rm -rf "$TMP_ROOT" "$FLOWDECK_TARBALL_PATH"

  installer-test:
    name: Installer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm ci
      - run: npm run build
      - name: Clean HOME install
        run: |
          HOME_TMP=$(mktemp -d)
          HOME=$HOME_TMP OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode \
            node bin/flowdeck.js install 2>&1
          node -e "
            const c = JSON.parse(require('fs').readFileSync('$HOME_TMP/.config/opencode/opencode.json','utf-8'));
            console.assert(c.plugin.includes('@heidi-dang/flowdeck'), 'Plugin not registered');
            console.assert(c.default_agent === 'heidi', 'Default agent not heidi');
            console.log('PASS: Clean HOME install');
          "
      - name: Malformed config preserved
        run: |
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          echo '{{{broken}}' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js install 2>&1 || true
          diff <(echo '{{{broken}}') "$OPENCODE_CONFIG_DIR"/opencode.json && echo "PASS: Malformed config preserved" || (echo "FAIL: Config modified" && exit 1)
      - name: JSONC comment retention
        run: |
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          printf '{\n  // this comment must remain\n  "plugin": [],\n  "default_agent": null\n}\n' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js install 2>&1
          grep -q "this comment must remain" "$OPENCODE_CONFIG_DIR"/opencode.json && echo "PASS: JSONC comments preserved" || (echo "FAIL: JSONC comments lost" && exit 1)
      - name: Existing default_agent preserved
        run: |
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          echo '{"plugin":[],"default_agent":"orchestrator"}' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js install 2>&1
          node -e "
            const c = JSON.parse(require('fs').readFileSync('$OPENCODE_CONFIG_DIR/opencode.json','utf-8'));
            console.assert(c.default_agent === 'orchestrator', 'Default changed');
            console.log('PASS: Existing default_agent preserved');
          "
      - name: Ownership safe uninstall without manifest (heidi)
        run: |
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          echo '{"plugin":["@heidi-dang/flowdeck","other-plugin"],"default_agent":"heidi"}' > "$OPENCODE_CONFIG_DIR"/opencode.json
          set +e
          node bin/flowdeck.js uninstall 2>&1
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "FAIL: Expected non-zero exit code when uninstalling without manifest"
            exit 1
          fi
          node -e "
            const c = JSON.parse(require('fs').readFileSync('$HOME_TMP/.config/opencode/opencode.json','utf-8'));
            console.assert(c.default_agent === 'heidi', 'Default agent was changed');
            console.assert(c.plugin.includes('@heidi-dang/flowdeck'), 'Plugin was removed');
            console.assert(c.plugin.includes('other-plugin'), 'Other plugin was removed');
            console.log('PASS: Uninstall without manifest fails non-zero and preserves config');
          "
      - name: Forced uninstall without manifest
        run: |
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          echo '{"plugin":["@heidi-dang/flowdeck","other-plugin"],"default_agent":"heidi"}' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js uninstall --force 2>&1
          node -e "
            const c = JSON.parse(require('fs').readFileSync('$HOME_TMP/.config/opencode/opencode.json','utf-8'));
            console.assert(c.default_agent === 'heidi', 'Default agent was changed');
            console.assert(!c.plugin.includes('@heidi-dang/flowdeck'), 'FlowDeck plugin was not removed');
            console.assert(c.plugin.includes('other-plugin'), 'Other plugin was removed');
            const fs = require('fs');
            console.assert(!fs.existsSync('$HOME_TMP/.config/opencode/.flowdeck-manifest.json'), 'Manifest was falsely created');
            console.log('PASS: Forced uninstall without manifest removes plugin, preserves default_agent & unrelated plugins, creates no manifest');
          "
      - name: Verify
        run: node bin/flowdeck.js verify 2>&1
      - name: Doctor
        run: node scripts/ci-doctor-smoke.mjs
      - name: Dry-run
        run: node bin/flowdeck.js dry-run 2>&1
      - name: Uninstall (with manifest)
        run: node bin/flowdeck.js uninstall 2>&1
      - name: CLI Integration Test (every command)
        run: |
          set -e
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          echo '{"plugin":[],"default_agent":null}' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js --help 2>&1 | grep -q "FlowDeck v" || { echo "FAIL: --help"; exit 1; }; echo "PASS: --help"
          node bin/flowdeck.js install 2>&1 | grep -q "FlowDeck installed" || { echo "FAIL: install"; exit 1; }; echo "PASS: install"
          node bin/flowdeck.js verify 2>&1 | grep -q "Verification passed" || { echo "FAIL: verify"; exit 1; }; echo "PASS: verify"
          node scripts/ci-doctor-smoke.mjs; echo "PASS: doctor"
          node bin/flowdeck.js config validate 2>&1 || { echo "FAIL: config validate"; exit 1; }; echo "PASS: config validate"
          node bin/flowdeck.js dry-run 2>&1 | grep -q "DRY RUN" || { echo "FAIL: dry-run"; exit 1; }; echo "PASS: dry-run"
          # Now test install --project
          node bin/flowdeck.js install --project 2>&1 | grep -q "FlowDeck installed" || { echo "FAIL: install --project"; exit 1; }; echo "PASS: install --project"
          node bin/flowdeck.js verify 2>&1 | grep -q "Verification passed" || { echo "FAIL: verify after --project"; exit 1; }; echo "PASS: verify after --project"
          node bin/flowdeck.js uninstall --force 2>&1 | grep -q "FlowDeck uninstalled" || { echo "FAIL: uninstall"; exit 1; }; echo "PASS: uninstall"
          # Now test install --local-repo and migrate
          node bin/flowdeck.js install --local-repo 2>&1 | grep -q "FlowDeck installed" || { echo "FAIL: install --local-repo"; exit 1; }; echo "PASS: install --local-repo"
          node bin/flowdeck.js verify 2>&1 | grep -q "Verification passed" || { echo "FAIL: verify after --local-repo"; exit 1; }; echo "PASS: verify after --local-repo"
          node bin/flowdeck.js migrate 2>&1 | grep -q -E "Migrating|Already using" || { echo "FAIL: migrate"; exit 1; }; echo "PASS: migrate"
          node bin/flowdeck.js rollback 2>&1 | grep -q "Rolled back" || { echo "FAIL: rollback"; exit 1; }; echo "PASS: rollback"
          node bin/flowdeck.js update 2>&1 | grep -q "Update complete" || { echo "FAIL: update"; exit 1; }; echo "PASS: update"
          echo "ALL CLI COMMANDS PASSED"

  rust-gates:
    name: Rust Gates (FDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path crates/fdx/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/fdx/Cargo.toml --all-targets -- -D warnings
      - name: Build FDX binary
        run: |
          cargo build --manifest-path crates/fdx/Cargo.toml
          cp target/debug/fdx target/release/fdx 2>/dev/null || true
      - name: Run FDX version check
        run: target/debug/fdx --version
      - run: cargo test --manifest-path crates/fdx/Cargo.toml --all

  test-fdx-parity:
    name: FDX Native Parity
    runs-on: ubuntu-latest
    needs: [test-matrix, build, rust-gates]
    # Required gate: must never be skipped. Runs even when an upstream job
    # fails so parity evidence is always produced for the exact head.
    if: always()

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Build FDX binary
        run: cargo build --manifest-path crates/fdx/Cargo.toml
      - name: Verify FDX binary path
        run: |
          BINARY="target/debug/fdx"
          if [ ! -f "$BINARY" ]; then
            BINARY="crates/fdx/target/debug/fdx"
          fi
          test -f "$BINARY" || { echo "Binary not found"; exit 1; }

          "$BINARY" --version
          echo "FDX_BINARY_PATH=$(pwd)/$BINARY" >> $GITHUB_ENV
      - name: Run shared fixture tests
        run: bun test tests/fdx-path-parity.test.ts
      - name: Run git-policy tests
        run: bun test tests/fdx-git-policy.test.ts
      - name: Run native parity with fallback disabled
        env:
          FDX_DISABLE_FALLBACK: "1"

        run: node scripts/verify-fdx-parity.mjs
      - name: Emit execution proof
        run: |
          echo "=== Native FDX Execution Proof ==="
          echo "Binary: $FDX_BINARY_PATH"
          "$FDX_BINARY_PATH" search --help
          echo "FDX_DISABLE_FALLBACK=1"
          echo "Shared fixture: tests/fixtures/path-scheme.json"
          echo "All parity tests completed."



  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
      - name: Dependency Audit
        run: npm audit --production --audit-level=high 2>&1
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          VERSION="8.18.2"
          curl --fail --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks version
      - name: Scan Git history
        run: |
          set -euo pipefail
          /tmp/gitleaks detect \
            --source . \
            --log-opts="--all" \
            --redact \
            --verbose

  local-installer:
    name: Local Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm ci
      - name: Local-repo install test
        run: |
          node bin/flowdeck.js install --local-repo 2>&1
          node bin/flowdeck.js verify 2>&1 | grep -i -q "passed" || (echo "FAIL: verify"; exit 1)
          echo "PASS: local-repo install on ${{ matrix.os }}"
      - name: Project install test
        run: |
          node bin/flowdeck.js install --project 2>&1
          echo "PASS: project install on ${{ matrix.os }}"

  packed-cli-matrix:
    name: Packed CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm ci
      - run: npm run build
      - name: Packed CLI test with spaces
        run: |
          set -e
          export GITHUB_SHA="$(git rev-parse HEAD)"
          node scripts/build-fdx-packages.mjs
          PACKAGE=$(npm pack 2>/dev/null | grep -E '\.tgz$' | tail -n 1 | tr -d '\r')
          TARBALL_PATH="$GITHUB_WORKSPACE/$PACKAGE"

          TARGET_DIR=$(node -e '
            const p = process.platform, a = process.arch;
            let t = null;
            if (p==="linux" && a==="x64") t="flowdeck-fdx-linux-x64-gnu";
            else if (p==="linux" && a==="arm64") t="flowdeck-fdx-linux-arm64-gnu";
            else if (p==="darwin" && a==="x64") t="flowdeck-fdx-darwin-x64";
            else if (p==="darwin" && a==="arm64") t="flowdeck-fdx-darwin-arm64";
            else if (p==="win32" && a==="x64") t="flowdeck-fdx-win32-x64";
            console.log(t || "");
          ')

          PLATFORM_TARBALL_PATH=""
          if [ -n "$TARGET_DIR" ] && [ -d "packages/$TARGET_DIR" ]; then
            cd "packages/$TARGET_DIR"
            PLATFORM_PKG=$(npm pack 2>/dev/null | grep -E '\.tgz$' | tail -n 1 | tr -d '\r')
            PLATFORM_TARBALL_PATH="$GITHUB_WORKSPACE/packages/$TARGET_DIR/$PLATFORM_PKG"
            cd "$GITHUB_WORKSPACE"
          fi

          TMP_ROOT=$(mktemp -d)
          # Cleanup trap: removes temp dirs on success AND failure. On Windows
          # a shell whose cwd is still inside TMP_ROOT cannot remove it
          # ("Device or resource busy"), so the trap steps out to the workspace
          # first. Cleanup failures must not mask the actual command result.
          trap 'cd "$GITHUB_WORKSPACE" 2>/dev/null || true; rm -rf "$TMP_ROOT" "$TARBALL_PATH" 2>/dev/null || true' EXIT
          SPACE_DIR="$TMP_ROOT/My Project With Spaces"
          mkdir -p "$SPACE_DIR/app" "$SPACE_DIR/home"
          cd "$SPACE_DIR/app"
          npm init -y > /dev/null 2>&1
          if [ -n "$PLATFORM_TARBALL_PATH" ] && [ -f "$PLATFORM_TARBALL_PATH" ]; then
            HOME="$SPACE_DIR/home" OPENCODE_CONFIG_DIR="$SPACE_DIR/home/.config/opencode" npm install "$TARBALL_PATH" "$PLATFORM_TARBALL_PATH" 2>&1
          else
            HOME="$SPACE_DIR/home" OPENCODE_CONFIG_DIR="$SPACE_DIR/home/.config/opencode" npm install "$TARBALL_PATH" 2>&1
          fi
          echo "=== Testing packed CLI ==="
          HOME="$SPACE_DIR/home" OPENCODE_CONFIG_DIR="$SPACE_DIR/home/.config/opencode" node node_modules/@heidi-dang/flowdeck/bin/flowdeck.js install || { echo "FAIL: install"; exit 1; }
          HOME="$SPACE_DIR/home" OPENCODE_CONFIG_DIR="$SPACE_DIR/home/.config/opencode" node node_modules/@heidi-dang/flowdeck/bin/flowdeck.js fdx repair || { echo "FAIL: fdx repair"; exit 1; }
          HOME="$SPACE_DIR/home" OPENCODE_CONFIG_DIR="$SPACE_DIR/home/.config/opencode" node node_modules/@heidi-dang/flowdeck/bin/flowdeck.js verify || { echo "FAIL: verify"; exit 1; }
          set +e
          HOME="$SPACE_DIR/home" OPENCODE_CONFIG_DIR="$SPACE_DIR/home/.config/opencode" node node_modules/@heidi-dang/flowdeck/bin/flowdeck.js doctor --profile minimal
          DOCTOR_EXIT=$?
          set -e
          if [ "$DOCTOR_EXIT" -ne 0 ]; then
            echo "FAIL: doctor exited with status $DOCTOR_EXIT (expected 0)"
            exit "$DOCTOR_EXIT"
          fi
          echo "PASS: doctor (exit code $DOCTOR_EXIT)"

          HOME="$SPACE_DIR/home" OPENCODE_CONFIG_DIR="$SPACE_DIR/home/.config/opencode" node node_modules/@heidi-dang/flowdeck/bin/flowdeck.js rollback || { echo "FAIL: rollback"; exit 1; }
          HOME="$SPACE_DIR/home" OPENCODE_CONFIG_DIR="$SPACE_DIR/home/.config/opencode" node node_modules/@heidi-dang/flowdeck/bin/flowdeck.js uninstall --force || { echo "FAIL: uninstall"; exit 1; }
          echo "PASS: all commands"
          # Step out of TMP_ROOT before cleanup; the EXIT trap removes the
          # temp files (a shell inside the directory being removed cannot
          # remove it on Windows).
          cd "$GITHUB_WORKSPACE"

  benchmark:
    name: FDX Index Benchmark (exact-SHA)
    runs-on: ubuntu-latest
    needs: [rust-gates]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Build FDX release binary
        run: cargo build --manifest-path crates/fdx/Cargo.toml --release
      - name: Run exact-SHA production benchmark (non-bypassable budgets)
        run: |
          mkdir -p artifact
          node scripts/bench-fdx-index.mjs --iterations 3 --baseline scripts/fdx-index-baseline.json --out artifact/fdx-index-benchmark.json
          test -f artifact/fdx-index-benchmark.json
      - name: Verify benchmark artifact SHA matches head
        run: |
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('artifact/fdx-index-benchmark.json', 'utf-8'));
            const head = require('child_process').execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf-8' }).trim();
            if (r.gitSha !== head) { console.error('artifact SHA ' + r.gitSha + ' != head ' + head); process.exit(1); }
            if (r.dirty) { console.error('benchmark ran on a dirty worktree; closure evidence requires a clean tree'); process.exit(1); }
            console.log('PASS: artifact bound to exact SHA ' + head + ' on a clean tree');
          "
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdx-index-benchmark
          path: artifact/fdx-index-benchmark.json
          if-no-files-found: error

  completion:
    name: Pipeline Completion
    if: always()
    needs: [lint-typecheck, typecheck, coverage, benchmark-runtime, benchmark, test-matrix, build, installer-test, rust-gates, security-scan, local-installer, packed-cli-matrix, test-fdx-parity]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## CI Production Gates" >> $GITHUB_STEP_SUMMARY
          echo "- Lint & Typecheck: ${{ needs.lint-typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Typecheck: ${{ needs.typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage: ${{ needs.coverage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime Benchmark (Branch-Head): ${{ needs.benchmark-runtime.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test Matrix: ${{ needs.test-matrix.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Validate: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Installer Tests: ${{ needs.installer-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Rust Gates: ${{ needs.rust-gates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Local Installer: ${{ needs.local-installer.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Packed CLI Matrix: ${{ needs.packed-cli-matrix.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- FDX Parity: ${{ needs.test-fdx-parity.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- FDX Index Benchmark: ${{ needs.benchmark.result }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.lint-typecheck.result }}" = "success" ] && \
             [ "${{ needs.typecheck.result }}" = "success" ] && \
             [ "${{ needs.coverage.result }}" = "success" ] && \
             [ "${{ needs.benchmark-runtime.result }}" = "success" ] && \
             [ "${{ needs.test-matrix.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.installer-test.result }}" = "success" ] && \
             [ "${{ needs.rust-gates.result }}" = "success" ] && \
             [ "${{ needs.security-scan.result }}" = "success" ] && \
             [ "${{ needs.local-installer.result }}" = "success" ] && \
             [ "${{ needs.packed-cli-matrix.result }}" = "success" ] && \
             [ "${{ needs.test-fdx-parity.result }}" = "success" ] && \
             [ "${{ needs.benchmark.result }}" = "success" ]; then
            echo "ALL GATES PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "SOME GATES FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
