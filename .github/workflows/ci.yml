name: CI Production Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feat/*"
      - "fix/*"
      - "ci/*"
      - "audit/*"
      - "docs/*"

jobs:
  matrix-test:
    name: Production Gates (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["20.x", "22.x", "24.x"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Integration Tests
        run: npm run test

      - name: Package Build
        run: npm run build

      - name: Doctor Health Verification
        run: npx bun test tests/phase7-installer-release.test.ts
