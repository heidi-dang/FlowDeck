name: CI Production Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feat/*"
      - "fix/*"
      - "ci/*"
      - "audit/*"
      - "docs/*"

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run typecheck
      - name: Repository Hygiene
        run: |
          git ls-files --exclude-standard --others | grep -q . && echo "Untracked files found" && exit 1 || echo "PASS: No untracked files"

  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      - run: npm run validate:skills
      - run: npm run validate:docs
      - name: npm pack validation
        run: |
          npm pack --dry-run 2>&1 | grep -E 'total files:' | grep -qE '[0-9]+'
          echo "PASS: npm pack valid"
      - name: Pack and install in isolated HOME
        run: |
          PACKAGE=$(npm pack 2>/dev/null)
          echo "Package: $PACKAGE"
          TMPHOME=$(mktemp -d)
          cd "$TMPHOME"
          npm init -y > /dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/$PACKAGE" > /dev/null 2>&1
          node -e "const p = require('$TMPHOME/node_modules/@heidi-dang/flowdeck/package.json'); console.assert(p.name === '@heidi-dang/flowdeck', 'Wrong: ' + p.name); console.log('PASS')"
          rm -f "$GITHUB_WORKSPACE/$PACKAGE"

  installer-test:
    name: Installer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Clean HOME install
        run: |
          HOME_TMP=$(mktemp -d)
          HOME=$HOME_TMP OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode \
            node bin/flowdeck.js install 2>&1
          node -e "
            const c = JSON.parse(require('fs').readFileSync('$HOME_TMP/.config/opencode/opencode.json','utf-8'));
            console.assert(c.plugin.includes('@heidi-dang/flowdeck'), 'Plugin not registered');
            console.assert(c.default_agent === 'heidi', 'Default agent not heidi');
            console.log('PASS: Clean HOME install');
          "
      - name: Malformed config preserved
        run: |
          HOME_TMP=$(mktemp -d)
          HOME=$HOME_TMP OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p $OPENCODE_CONFIG_DIR
          echo '{{{broken}}' > $OPENCODE_CONFIG_DIR/opencode.json
          node bin/flowdeck.js install 2>&1 || true
          diff <(echo '{{{broken}}') $OPENCODE_CONFIG_DIR/opencode.json && echo "PASS: Malformed config preserved" || (echo "FAIL: Config modified" && exit 1)
      - name: JSONC comment retention
        run: |
          HOME_TMP=$(mktemp -d)
          HOME=$HOME_TMP OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p $OPENCODE_CONFIG_DIR
          printf '{\n  // this comment must remain\n  "plugin": [],\n  "default_agent": null\n}\n' > $OPENCODE_CONFIG_DIR/opencode.json
          node bin/flowdeck.js install 2>&1
          grep -q "this comment must remain" $OPENCODE_CONFIG_DIR/opencode.json && echo "PASS: JSONC comments preserved" || (echo "FAIL: JSONC comments lost" && exit 1)
      - name: Existing default_agent preserved
        run: |
          HOME_TMP=$(mktemp -d)
          HOME=$HOME_TMP OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p $OPENCODE_CONFIG_DIR
          echo '{"plugin":[],"default_agent":"orchestrator"}' > $OPENCODE_CONFIG_DIR/opencode.json
          node bin/flowdeck.js install 2>&1
          node -e "
            const c = JSON.parse(require('fs').readFileSync('$HOME_TMP/.config/opencode/opencode.json','utf-8'));
            console.assert(c.default_agent === 'orchestrator', 'Default changed');
            console.log('PASS: Existing default_agent preserved');
          "
      - name: Verify
        run: node bin/flowdeck.js verify 2>&1
      - name: Doctor
        run: node bin/flowdeck.js doctor 2>&1
      - name: Dry-run
        run: node bin/flowdeck.js dry-run 2>&1
      - name: Uninstall
        run: node bin/flowdeck.js uninstall 2>&1
      - name: CLI Integration Test (all commands)
        run: |
          set -e
          HOME_TMP=$(mktemp -d)
          export HOME=$HOME_TMP
          export OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p "$OPENCODE_CONFIG_DIR"
          echo '{"plugin":[],"default_agent":null}' > "$OPENCODE_CONFIG_DIR"/opencode.json
          node bin/flowdeck.js --help 2>&1 | grep -q "FlowDeck v" && echo "PASS: --help"
          node bin/flowdeck.js install 2>&1 | grep -q "FlowDeck installed" && echo "PASS: install"
          node bin/flowdeck.js verify 2>&1 | grep -q "Verification passed" && echo "PASS: verify"
          node bin/flowdeck.js doctor 2>&1 && echo "PASS: doctor"
          node bin/flowdeck.js config validate 2>&1 | grep -q "Valid JSON" && echo "PASS: config validate"
          node bin/flowdeck.js dry-run 2>&1 | grep -q "DRY RUN" && echo "PASS: dry-run"
          node bin/flowdeck.js uninstall 2>&1 | grep -q "Uninstalled" && echo "PASS: uninstall"
          echo "ALL CLI COMMANDS PASSED"
      - name: State Migration Test
        run: |
          set -e
          HOME_TMP=$(mktemp -d)
          HOME=$HOME_TMP OPENCODE_CONFIG_DIR=$HOME_TMP/.config/opencode
          mkdir -p $OPENCODE_CONFIG_DIR
          # Simulate upstream config
          echo '{"plugin":["@dv.nghiem/flowdeck"],"default_agent":null}' > $OPENCODE_CONFIG_DIR/opencode.json
          node bin/flowdeck.js migrate 2>&1 | grep -q "Migrated" && echo "PASS: migrate from upstream"
          node -e "
            const c = JSON.parse(require('fs').readFileSync('$OPENCODE_CONFIG_DIR/opencode.json','utf-8'));
            console.assert(c.plugin.includes('@heidi-dang/flowdeck'), 'Fork not registered after migrate');
            console.assert(c.default_agent === 'heidi', 'Default agent not set');
            console.log('PASS: Migration state verified');
          "
          # Test rollback
          node bin/flowdeck.js rollback 2>&1 | grep -q "Rolled back" && echo "PASS: rollback"
          node bin/flowdeck.js install 2>&1 && echo "PASS: reinstall after rollback"
      - name: FDX Version Compatibility Test
        run: |
          set -e
          PLUGIN_VER=$(node -e "console.log(require('./package.json').version)")
          FDX_VER=""
          if [ -f crates/fdx/Cargo.toml ]; then
            FDX_VER=$(grep '^version' crates/fdx/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          fi
          if [ -n "$FDX_VER" ]; then
            echo "Plugin v$PLUGIN_VER, FDX v$FDX_VER"
            # Plugin 0.8.0-alpha.1 and FDX 0.1.0 intentionally diverge
            PLUGIN_BASE=$(echo "$PLUGIN_VER" | sed 's/-.*//')
            if [ "$PLUGIN_BASE" != "$FDX_VER" ]; then
              echo "WARN: Versions diverge (plugin base $PLUGIN_BASE != fdx $FDX_VER) - intentional"
            else
              echo "PASS: Versions match"
            fi
          else
            echo "No FDX crate found - skipping"
          fi

  rust-gates:
    name: Rust Gates (FDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo Format Check
        run: cargo fmt --manifest-path crates/fdx/Cargo.toml --check
      - name: Clippy Check
        run: cargo clippy --manifest-path crates/fdx/Cargo.toml --all-targets -- -D warnings
      - name: Build FDX binary
        run: |
          cargo build --manifest-path crates/fdx/Cargo.toml
          cp target/debug/fdx target/release/fdx 2>/dev/null || true
      - name: Cargo Test
        run: cargo test --manifest-path crates/fdx/Cargo.toml --all

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Secret Detection
        run: |
          # Check for hardcoded credential patterns (not code references to the concepts)
          if git grep -InE '(password\s*=\s*["'\'']|secret\s*=\s*["'\'']|api.?key\s*=\s*["'\'']|token\s*=\s*["'\''](?![\s]*\))' -- ':!*.md' ':!*.d.ts' ':!*.json' 2>/dev/null | grep -vE '(node_modules|example|test|mock|placeholder|your_|CHANGEME)' | grep -vE '"(password|secret|token|key)"' | grep -vE '"(auth|crypto|encrypt)"'; then
            echo "FAIL: Possible hardcoded credentials found"
            exit 1
          fi
          echo "PASS: No hardcoded credentials detected"
      - name: Dependency Audit
        run: |
          npm audit --production --audit-level=high 2>&1

  completion:
    name: Pipeline Completion
    if: always()
    needs: [lint-typecheck, test-matrix, build, installer-test, rust-gates, security-scan]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## CI Production Gates Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Lint & Typecheck: ${{ needs.lint-typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test Matrix (ubuntu): ${{ needs.test-matrix.results['ubuntu-latest'] || needs.test-matrix.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test Matrix (macos): ${{ needs.test-matrix.results['macos-latest'] || needs.test-matrix.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test Matrix (windows): ${{ needs.test-matrix.results['windows-latest'] || needs.test-matrix.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Validate: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Installer Tests: ${{ needs.installer-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Rust Gates: ${{ needs.rust-gates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.lint-typecheck.result }}" = "success" ] && \
             [ "${{ needs.test-matrix.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.installer-test.result }}" = "success" ] && \
             [ "${{ needs.rust-gates.result }}" = "success" ] && \
             [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "ALL GATES PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "SOME GATES FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
