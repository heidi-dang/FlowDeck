name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish @heidi-dang/flowdeck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # For npm provenance

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Tag/Version Alignment
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "FAIL: git tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag/version alignment verified: $GITHUB_REF_NAME == v$PKG_VERSION"

      - name: Build Package
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Validate Package
        run: |
          echo "Validating package identity..."
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf-8'));
            if (pkg.name !== '@heidi-dang/flowdeck') {
              console.error('Package name is ' + pkg.name + ' — expected @heidi-dang/flowdeck');
              process.exit(1);
            }
            console.log('Package identity verified: @heidi-dang/flowdeck v' + pkg.version);
          "
          echo "Validating package contents (npm pack --dry-run --json)..."
          node -e "
            const { execFileSync } = require('child_process');
            const out = JSON.parse(execFileSync('npm', ['pack', '--dry-run', '--json'], { encoding: 'utf-8' }))[0];
            const paths = out.files.map(f => f.path);
            const required = ['install.sh', 'dist/index.js', 'bin/flowdeck.js', 'postinstall.mjs', 'src/doctor/cli.mjs'];
            const missing = required.filter(r => !paths.some(p => p === r || p.startsWith(r + '/')));
            if (missing.length > 0) {
              console.error('FAIL: required runtime files missing from package:', missing.join(', '));
              process.exit(1);
            }
            const forbidden = ['tsconfig.json', 'uninstall.sh', '.gitignore', 'target', 'coverage', '.env', '.npmrc', 'bun.lock', 'crates'];
            const bad = paths.filter(p => forbidden.some(f => p === f || p.startsWith(f + '/')) || /\\.(tmp|log)$/.test(p));
            if (bad.length > 0) {
              console.error('FAIL: development caches, secrets, or build artifacts present in package:', bad.join(', '));
              process.exit(1);
            }
            console.log('Package contents verified: ' + out.files.length + ' files, ' + out.size + ' bytes');
          "

      - name: Build Platform Packages
        run: node scripts/build-fdx-packages.mjs

      - name: Check Registry Availability
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"

          set +e
          LOOKUP_OUTPUT="$(npm view "@heidi-dang/flowdeck@${PKG_VERSION}" version 2>&1)"
          LOOKUP_EXIT=$?
          set -e

          if [ "$LOOKUP_EXIT" -eq 0 ]; then
            echo "FAIL: @heidi-dang/flowdeck@${PKG_VERSION} already exists on the registry"
            printf '%s\n' "$LOOKUP_OUTPUT"
            exit 1
          fi

          if ! printf '%s\n' "$LOOKUP_OUTPUT" | grep -q "E404" || \
             ! printf '%s\n' "$LOOKUP_OUTPUT" | grep -q "No match found for version"; then
            echo "FAIL: registry lookup for ${PKG_VERSION} failed unexpectedly:"
            printf '%s\n' "$LOOKUP_OUTPUT"
            exit 1
          fi

          echo "Registry availability verified: @heidi-dang/flowdeck@${PKG_VERSION} is not published"

      - name: Publish Platform Packages (Resumable & Idempotent)
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PLATFORM_PKGS=(
            "flowdeck-fdx-darwin-arm64"
            "flowdeck-fdx-darwin-x64"
            "flowdeck-fdx-linux-arm64-gnu"
            "flowdeck-fdx-linux-x64-gnu"
            "flowdeck-fdx-linux-x64-musl"
            "flowdeck-fdx-win32-x64"
          )

          for pkg in "${PLATFORM_PKGS[@]}"; do
            echo "=== Checking registry state for @heidi-dang/${pkg}@${PKG_VERSION} ==="
            set +e
            EXISTS_OUT="$(npm view "@heidi-dang/${pkg}@${PKG_VERSION}" version 2>&1)"
            EXISTS_EXIT=$?
            set -e

            if [ "$EXISTS_EXIT" -eq 0 ]; then
              echo "INFO: @heidi-dang/${pkg}@${PKG_VERSION} is already published on npm. Skipping re-publish."
              continue
            fi

            echo "=== Publishing platform package @heidi-dang/${pkg}@${PKG_VERSION} from matrix .tgz artifact ==="
            cd "packages/${pkg}"
            TGZ=$(ls *.tgz | head -n 1)
            if [ -n "$TGZ" ] && [ -f "$TGZ" ]; then
              npm publish "$TGZ" --provenance --access public || { echo "FAIL: Failed to publish $TGZ"; exit 1; }
            else
              npm publish --provenance --access public || { echo "FAIL: Failed to publish @heidi-dang/${pkg}"; exit 1; }
            fi
            cd "$GITHUB_WORKSPACE"

            echo "Verifying availability of @heidi-dang/${pkg}@${PKG_VERSION} on npm..."
            npm view "@heidi-dang/${pkg}@${PKG_VERSION}" version || { echo "FAIL: @heidi-dang/${pkg}@${PKG_VERSION} not found on registry after publish"; exit 1; }
          done

          echo "Verifying all six platform packages are available prior to main publish..."
          for pkg in "${PLATFORM_PKGS[@]}"; do
            npm view "@heidi-dang/${pkg}@${PKG_VERSION}" version > /dev/null || { echo "FAIL: Platform package @heidi-dang/${pkg}@${PKG_VERSION} missing from registry"; exit 1; }
          done
          echo "ALL SIX PLATFORM PACKAGES CONFIRMED AVAILABLE ON NPM"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Main Package to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
